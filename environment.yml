# Conda environment for the archive.
#
# The main pipeline (parser, census, independent verifier, conditioning
# analysis) is Python standard library only: conda env create with just
# python is sufficient for reproduce_all.sh.
#
# The exploratory CP-SAT programs retained with paper Section 8 additionally
# need OR-Tools (CP-SAT).  If you want those too:
#
#   python -m pip install -r requirements-solver.txt
#
name: no3in-archive
channels:
  - conda-forge
dependencies:
  - python>=3.9
